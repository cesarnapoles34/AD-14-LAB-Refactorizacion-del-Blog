<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>César Nápoles | Contacto</title>
  <!-- Tarea 1: Bootstrap por CDN (va antes de style.css para poder sobreescribirlo) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Encabezado -->
  <header class="bg-dark text-white text-center py-4">
    <h1 class="display-5 fw-bold">César Nápoles Rodríguez</h1>
    <p class="mb-0 text-white-50">Desarrollador Java Full Stack Jr.</p>
  </header>

  <!-- Tarea 3.3: Navbar de Bootstrap -->
  <nav class="navbar navbar-expand bg-secondary-subtle border-bottom">
    <div class="container-fluid justify-content-center">
      <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contacto</a></li>
      </ul>
    </div>
  </nav>

  <!-- Tarea 3.4: Grid de Bootstrap (2 + 8 + 2 = 12 columnas) -->
  <main class="container-fluid flex-grow-1">
    <div class="row h-100">
      <!-- Columna izquierda: reservada para publicidad -->
      <aside class="col-2 border-end lateral"></aside>

      <!-- Contenido -->
      <section class="col-8 p-4">
        <h2 class="text-center mb-4">Contáctame</h2>
        <p>¿Tienes una oportunidad, una duda o un proyecto? Escríbeme y te respondo.</p>

        <!-- Aquí aparece la alerta en vivo -->
        <div id="alerta"></div>

        <form id="formContacto">
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-dark">Enviar</button>
        </form>
      </section>

      <!-- Columna derecha: reservada para noticias -->
      <aside class="col-2 border-start lateral"></aside>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-1">César Nápoles Rodríguez · <a class="link-light" href="mailto:cesarnapoles34@gmail.com">cesarnapoles34@gmail.com</a></p>
    <p class="mb-0">
      <a class="link-light me-3" href="https://github.com/cesarnapoles34" target="_blank">GitHub</a>
      <a class="link-light" href="https://www.linkedin.com/in/cesarnapoles" target="_blank">LinkedIn</a>
    </p>
  </footer>

  <!-- Tarea 1: JS de Bootstrap al final del body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
